name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: skillforge_test
          POSTGRES_DB: skillforge_test
        ports: ['55433:5432']
        options: --health-cmd="pg_isready -U skillforge -d skillforge_test" --health-interval=2s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm test:e2e
