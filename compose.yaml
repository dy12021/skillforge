name: skillforge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge_local
      POSTGRES_DB: skillforge
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["skillforge_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge"]
      interval: 2s
      timeout: 3s
      retries: 30
  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge_test
      POSTGRES_DB: skillforge_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  skillforge_data:
